rules:
  # Nothing older than the previous run's date.
  max_age_days: 2
  # Skip anyone with nothing new. Do not pad.
  skip_empty: true
  # Rough ceiling per person so one high-volume blog cannot swamp the page.
  max_items_per_person: 4

