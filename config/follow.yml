# Drives the whole daily run. Hand-edited; the build does not read this,
# the research agent does. Order here is the order on the page.
#
# `feed:` saves the agent rediscovering sources every morning. Entries marked
# UNVERIFIED have not been fetched by anyone yet: check them on the next run and
# report any that 404 so this file can be corrected. Entries marked CHECKED were
# fetched successfully on the date given.
#
# `search:` is the starting query for the news-about-them pass, which runs only
# when someone has published little or nothing themselves. It is a hint, not the
# only query worth trying.

