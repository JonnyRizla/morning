rules:
  # Nothing older than the previous day file. The run fires 06:00 Sydney /
  # 20:00 UTC, so it is mostly catching the PREVIOUS US working day — a US date
  # of "yesterday" is the normal case, not a stale item.
  max_age_days: 2
  # Skip anyone with nothing new. Do not pad.
  skip_empty: true
  # Hard ceiling per person, counting both the own-output and news-about passes.
  # Spend it on the best four, not the first four.
  max_items_per_person: 4
  # Pass two (news about a person) runs only when pass one found fewer than two.
  news_about_threshold: 2

